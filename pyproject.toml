[project]
name = "nx-telemetry-monitor"
version = "0.2.0"
description = "FinsROV multi-mode ground station with MAVLink 2 and simulated NX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-contrib-python>=4.10,<5",
    "Pillow>=10.0,<13",
    "PyYAML>=6.0,<7",
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "pygame-ce>=2.5,<3",
    "pymavlink>=2.4.49,<3",
    "lxml>=5,<7",
]

[tool.uv]
package = false
